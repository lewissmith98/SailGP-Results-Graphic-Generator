<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--carbon:#141414;--gold:#C9A63B;--panel:#171717;--panel-line:#2a2a2a;--ink:#ececec;--ink-dim:#8a8a8a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,sans-serif;background:#0b0b0b;color:var(--ink);
    display:grid;grid-template-columns:370px 1fr;min-height:100vh}
  @media (max-width:860px){body{grid-template-columns:1fr}}
  .panel{background:var(--panel);border-right:1px solid var(--panel-line);padding:24px 20px 60px;overflow-y:auto}
  .panel h1{font-weight:900;font-size:20px;letter-spacing:.02em;margin:0 0 3px;text-transform:uppercase}
  .panel h1 span{color:var(--gold)}
  .panel .sub{color:var(--ink-dim);font-size:13px;margin:0 0 22px;line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
  .field input,.field select{width:100%;background:#0d0d0d;border:1px solid var(--panel-line);color:var(--ink);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit}
  .field select{cursor:pointer}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
  button{font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;border:none;border-radius:7px}
  .btn-primary{background:var(--gold);color:#141414;padding:11px 16px;width:100%}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--panel-line);padding:9px 14px;width:100%}
  .btn-ghost:hover{border-color:var(--gold)}
  .status{font-size:12px;margin-top:10px;min-height:16px;line-height:1.4}
  .status.err{color:#e0776b}.status.ok{color:var(--gold)}
  .hint{font-size:11.5px;color:var(--ink-dim);line-height:1.55;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#0d0d0d;border:1px solid var(--panel-line);color:var(--ink-dim);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;user-select:none;letter-spacing:.04em}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#141414}
  code{background:#0d0d0d;padding:1px 5px;border-radius:4px;font-size:11px;color:#eaeaea}
  .divider{height:1px;background:var(--panel-line);margin:20px 0}
  .stage{display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;overflow:auto}
  #cv{display:block;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:2px}
</style>
</head>
<body>

  <div class="panel">
    <img id="menu-logo" alt="The Foil" style="width:150px;height:auto;display:block;margin-bottom:16px">
    <h1>SailGP Results Generator</h1>

    <div class="field" style="margin-top:18px">
      <label>Load results file</label>
      <input type="file" id="in-file" accept=".csv,.xlsx,.xls">
    </div>
    <div class="hint">In Google Sheets: <b>File → Download → CSV</b> (or <b>.xlsx</b>), then choose it here.</div>

    <div class="divider"></div>

    <div class="field">
      <label>Graphic type</label>
      <select id="in-type">
        <option value="standings">Standings / event results</option>
        <option value="race">Race-by-race table</option>
      </select>
    </div>

    <div id="grp-race" style="display:none">
      <div class="field">
        <label>Event</label>
        <select id="in-event"></select>
      </div>
      <div class="field">
        <label>Groups shown</label>
        <select id="in-group"><option value="">All groups</option></select>
      </div>
      <div class="field">
        <label>Row label</label>
        <select id="in-label">
          <option value="auto">Auto</option>
          <option value="team">Team name</option>
          <option value="short">Short team name</option>
          <option value="code">Country code</option>
        </select>
      </div>
      <div class="field">
        <label>Races included</label>
        <div class="chips" id="race-chips"></div>
        <div class="hint" id="race-hint"></div>
      </div>
      <label style="display:flex;align-items:center;gap:9px;margin-bottom:16px;cursor:pointer;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="in-qual" checked style="width:auto;accent-color:var(--gold);cursor:pointer">
        Highlight top 2
      </label>
    </div>

    <div id="grp-standings">
    <div class="field">
      <label>Results</label>
      <select id="in-col"></select>
    </div>

    <div class="field">
      <label>Relative position change</label>
      <select id="in-prev"><option value="">None</option></select>
    </div>

      const boxH=capH/Math.max(0.2,1-ink.t-ink.b);            // grow the box so the INK is capH tall
      const boxW=boxH*(wm.width/wm.height);
      ctx.drawImage(wm,(m.mX+m.cW)-boxW*(1-ink.r),capTop-ink.t*boxH,boxW,boxH);
    }
  }
  function drawFooter(ctx,m,L){
    ctx.textBaseline='alphabetic';setFont(ctx,800,m.footSize);
    ctx.textAlign='left';ctx.fillStyle='#fff';setLS(ctx,m.footSize*0.26);
    if(L.footl)ctx.fillText(L.footl.toUpperCase(),m.mX,m.H-m.mY);
    ctx.textAlign='right';ctx.fillStyle=GOLD;setLS(ctx,m.footSize*0.2);
    if(L.footr)ctx.fillText(L.footr.toUpperCase(),m.W-m.mX,m.H-m.mY);
    setLS(ctx,0);ctx.textAlign='left';
  }
  function drawRows(ctx,ranked,logos,m,x0,y0,showPen,showMove,showDriver,showCode){
    const cW=m.cW,rowH=m.rowH,gap=m.gap,cut=Math.round(rowH*0.25);
    const anySfx=ranked.some(o=>o.sfx);
    const finOn=$('in-fin')?$('in-fin').checked:false;   // white stroke on the event-final qualifiers
    const posCol=Math.round(rowH*0.975),logoCol=Math.round(rowH*0.75),namePad=Math.round(rowH*0.18);
    const ptsCol=Math.round(rowH*(anySfx?PTS_COL_SFX:PTS_COL));
    const penCol=showPen?Math.round(rowH*1.02):0;
    const moveCol=showMove?Math.round(rowH*0.98):0;
    const nx=x0+posCol+logoCol+namePad, goldX0=x0+cW-penCol-ptsCol, moveX0=goldX0-moveCol;
    const anyDrv=showDriver&&ranked.some(o=>o.drv);
    // Single-line layout (team | code | driver) is used on 16:9 always, and on 1:1 when the code is shown.
    const inline=(m.W>m.H)||(m.W===m.H&&showCode);
    // The inline layout ends on the driver name, which sits right up against the gold box with only
    // namePad between them. Give that side a wider gutter so the two never crowd each other.
    const rightPad=inline?Math.round(rowH*NAME_END_PAD):namePad;
    const nameW=Math.max(10,(moveX0-rightPad)-nx);
    const codeOn=showCode&&inline;
    let teamSize,drvSize,codeSize=0,teamColW=0,codeColW=0,codeOff=0,drvOff=0;
    if(inline){
      teamSize=rowH*0.40; codeSize=rowH*0.34; drvSize=rowH*0.30;
      setFont(ctx,800,teamSize); teamColW=Math.max(1,...ranked.map(o=>ctx.measureText((o.team||'').toUpperCase()).width));
      if(codeOn){ setFont(ctx,900,codeSize); codeColW=Math.max(1,...ranked.map(o=>ctx.measureText((o.code||'').toUpperCase()).width)); }
      let drvColW=0; if(anyDrv){ setFont(ctx,600,drvSize); drvColW=Math.max(1,...ranked.map(o=>ctx.measureText((o.drv||'').toUpperCase()).width)); }
      let g1=teamSize*2.2, g2=codeSize*2.2;                 // generous padding either side of the code
      let total=teamColW+(codeOn?g1+codeColW:0)+(anyDrv?((codeOn?g2:g1)+drvColW):0);
      if(total>nameW){const s=nameW/total; teamSize*=s;codeSize*=s;drvSize*=s;teamColW*=s;codeColW*=s;g1*=s;g2*=s;}
      codeOff=teamColW+g1;
      drvOff=codeOn?(codeOff+codeColW+g2):(teamColW+g1);
    } else {
      // portrait/vertical/square: team over driver, sized so the longest name still fits (never truncates)
      teamSize=rowH*(anyDrv?0.30:0.42); setFont(ctx,800,teamSize);
      const maxTeam=Math.max(1,...ranked.map(o=>ctx.measureText((o.team||'').toUpperCase()).width));
      if(maxTeam>nameW) teamSize*=nameW/maxTeam;
      drvSize=rowH*0.1625; setFont(ctx,600,drvSize);
      const maxDrv=Math.max(1,...ranked.map(o=>ctx.measureText((o.drv||'').toUpperCase()).width));
      if(maxDrv>nameW) drvSize*=nameW/maxDrv;
    }
    for(let i=0;i<ranked.length;i++){
      const o=ranked[i],x=x0,w=cW,h=rowH,y=y0+i*(rowH+gap);
      const goldX=x+w-penCol-ptsCol, penX=x+w-penCol, moveX=goldX-moveCol;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w-cut,y);ctx.lineTo(x+w,y+cut);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
      ctx.save();ctx.clip();
      ctx.fillStyle='#1a1a1a';ctx.fillRect(x,y,w,h);
      ctx.fillStyle=GOLD;ctx.fillRect(goldX,y,ptsCol,h);
      if(showPen&&o.pen!==null){ctx.fillStyle=o.pen<0?PEN_RED:PEN_GREEN;ctx.fillRect(penX,y,penCol,h);}
      ctx.restore();
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w-cut,y);ctx.lineTo(x+w,y+cut);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
      if(finOn&&o.fin!==null){ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(2,Math.round(rowH*0.038));}
      else{ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;}
      ctx.stroke();
      // position
      setFont(ctx,900,rowH*0.375);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(i+1),x+posCol/2,y+h/2+1);
      // logo / code
      const img=logos[i],lcx=x+posCol+logoCol/2,lcy=y+h/2,lmax=rowH*0.6;
      if(img){const s=Math.min(lmax/img.width,lmax/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,lcx-dw/2,lcy-dh/2,dw,dh);}
      else{setFont(ctx,900,rowH*0.225);ctx.fillStyle=GOLD;ctx.fillText(o.code||'',lcx,lcy+1);}
      // name area
      ctx.textAlign='left';
      const team=(o.team||'').toUpperCase(),code=(o.code||'').toUpperCase(),drv=showDriver?(o.drv||'').toUpperCase():'';
      if(inline){
        const my=y+h/2+1; ctx.textBaseline='middle';
        setFont(ctx,800,teamSize);ctx.fillStyle='#fff';ctx.fillText(team,nx,my);
        if(codeOn){setFont(ctx,900,codeSize);ctx.fillStyle=GOLD;ctx.fillText(code,nx+codeOff,my);}
        if(anyDrv&&drv){setFont(ctx,600,drvSize);ctx.fillStyle='#9a9a9a';setLS(ctx,drvSize*0.02);ctx.fillText(drv,nx+drvOff,my);setLS(ctx,0);}
      } else if(drv){
        const teamCap=teamSize*0.72, drvCap=drvSize*0.72, lineGap=teamSize*0.20+5;
        const blockTop=y+h/2-(teamCap+lineGap+drvCap)/2;
        ctx.textBaseline='alphabetic';
        setFont(ctx,800,teamSize);ctx.fillStyle='#fff';ctx.fillText(team,nx,blockTop+teamCap);
        setFont(ctx,600,drvSize);ctx.fillStyle='#9a9a9a';setLS(ctx,drvSize*0.02);
        ctx.fillText(drv,nx,blockTop+teamCap+lineGap+drvCap);setLS(ctx,0);
      } else {
        setFont(ctx,800,teamSize);ctx.fillStyle='#fff';ctx.textBaseline='middle';
        ctx.fillText(team,nx,y+h/2+1);
      }
      // position change (arrow + number), left of gold box
      if(showMove&&o.move!==null&&o.move!==0){
        const up=o.move>0,col=up?PEN_GREEN:PEN_RED,n=Math.abs(o.move);
        setFont(ctx,800,rowH*0.28);ctx.textAlign='left';ctx.textBaseline='middle';
        const numStr=String(n),numW=ctx.measureText(numStr).width,aw=rowH*0.24,agap=rowH*0.07,ah=rowH*0.24;
        const total=aw+agap+numW,gx=moveX+moveCol/2-total/2,ay=y+h/2;
        ctx.fillStyle=col;ctx.beginPath();
        if(up){ctx.moveTo(gx+aw/2,ay-ah/2);ctx.lineTo(gx,ay+ah/2);ctx.lineTo(gx+aw,ay+ah/2);}
        else{ctx.moveTo(gx,ay-ah/2);ctx.lineTo(gx+aw,ay-ah/2);ctx.lineTo(gx+aw/2,ay+ah/2);}
        ctx.closePath();ctx.fill();
        ctx.fillText(numStr,gx+aw+agap,ay+1);
      }
      // points
      // Value, plus an optional superscript suffix (season points: 10 PTS). The suffix's cap TOP is
      // aligned to the number's cap top using the measured ink ascents, and the pair is centred
      // together in the gold box.
      const vTxt=String(o.v), sfx=o.sfx||'';
      const numSize=rowH*0.45, sfxSize=rowH*0.21, sfxGap=sfx?Math.round(rowH*0.055):0;
      ctx.textBaseline='middle';ctx.fillStyle=CARBON;
      setFont(ctx,900,numSize);
      const numM=ctx.measureText(vTxt), numW=numM.width;
      let sfxW=0,sfxM=null;
      if(sfx){setFont(ctx,900,sfxSize);sfxM=ctx.measureText(sfx);sfxW=sfxM.width;}
      const blockW=numW+sfxGap+sfxW, bx=goldX+ptsCol/2-blockW/2, vcy=y+h/2+1;
      ctx.textAlign='left';
      setFont(ctx,900,numSize);ctx.fillText(vTxt,bx,vcy);
      if(sfx){
        setFont(ctx,900,sfxSize);
        const na=numM.actualBoundingBoxAscent||numSize*0.36, sa=sfxM.actualBoundingBoxAscent||sfxSize*0.36;
        ctx.fillText(sfx,bx+numW+sfxGap,vcy-na+sa);   // cap tops aligned
      }
      ctx.textAlign='center';
      // penalty / award
      if(showPen&&o.pen!==null){
        setFont(ctx,900,rowH*0.40);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText((o.pen>0?'+':'')+o.pen,penX+penCol/2,y+h/2+1);
      }
    }
  }

  async function renderStandings(){
    const [W,H]=curDims(), cv=$('cv');
    cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d');
    const ranked=getRanked($('in-col').value), N=ranked.length||1, L=labels();
    const showPen=$('in-pen').checked&&ranked.some(o=>o.pen!==null);
    const showMove=ranked.some(o=>o.move!==null&&o.move!==0);
    const showDriver=$('in-driver').checked, showCode=$('in-code').checked;
    const m=fitMetrics(ctx,W,H,N,ranked,showPen,showMove,showDriver,showCode);
    const [wm,logos]=await Promise.all([loadImg(WORDMARK),Promise.all(ranked.map(o=>loadImg(o.logoSrc)))]);
    drawBackground(ctx,W,H);
    drawHeader(ctx,m,L,wm);
    drawRows(ctx,ranked,logos,m,m.mX,m.rowsTop,showPen,showMove,showDriver,showCode);
    drawFooter(ctx,m,L);
    fitPreview();
  }
  async function render(){ return isRaceMode()?renderRace():renderStandings(); }
  function fitPreview(){
    const cv=$('cv'),stage=document.querySelector('.stage');
    const scale=Math.min(1,(stage.clientWidth-48)/cv.width);
    cv.style.width=(cv.width*scale)+'px';cv.style.height=(cv.height*scale)+'px';
  }
  window.addEventListener('resize',fitPreview);

  function downloadBlob(b,name){const u=URL.createObjectURL(b);const a=document.createElement('a');a.download=name;a.href=u;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);status('Downloaded.','ok');}
  const fname=sfx=>(($('in-title').value||'standings').toLowerCase().replace(/\s+/g,'-'))+sfx+'.png';
  async function exportFull(){status('Rendering…');await render();$('cv').toBlob(b=>downloadBlob(b,fname('-thefoil')),'image/png');}
  async function exportCards(){
    status('Rendering…');
    if(isRaceMode())return exportRaceCards();

    const c=document.createElement('canvas');c.width=m.cW;c.height=m.rowsH;
    drawRows(c.getContext('2d'),ranked,logos,m,0,0,showPen,showMove,showDriver,showCode);
    c.toBlob(b=>downloadBlob(b,fname('-cards')),'image/png');
  }

  // ================= RACE-BY-RACE TABLE =================
  // Points scored for finishing positions 1,2,3,… within a group. Beyond the list = 0.
  const RACE_POINTS=[5,4,3,2,1,0,0];
  const racePoints=p=>(p===null||p<1)?0:(RACE_POINTS[p-1]!==undefined?RACE_POINTS[p-1]:0);
  const isRaceMode=()=>$('in-type').value==='race';
  let RACE_SEL={};   // event key -> Set of race numbers currently ticked

  /* Race columns are <event>_r<token>_position. The token decides what the column IS:
       NUMERIC  (r1, r2, … r5)  a group race — gets a chip and scores 5-4-3-2-1-0-0.
       NON-NUMERIC (rFinal, …)  recognised but deliberately EXCLUDED from the group table.
                                The event final is a 4-boat race that decides the podium, not
                                group qualifying, so summing it into group points would distort
                                the table. It is matched (never silently dropped) and exposed
                                via specialRaceCols() for a future final/podium graphic — and it
                                is the natural source for <event>_event_position of the top 4. */
  const RE_RACE_COL=/^(.*)_r([A-Za-z0-9]+)_position$/i;
  function raceEventsAll(){
    const map=new Map();
    STATE.headers.forEach(h=>{
      const mm=h&&h.match(RE_RACE_COL);
      if(!mm)return;
      if(!STATE.rows.some(r=>num(r[h])!==null))return;   // ignore columns with no data yet
      const ev=mm[1], tok=mm[2];
      if(!map.has(ev))map.set(ev,{races:[],special:[]});
      if(/^\d+$/.test(tok)) map.get(ev).races.push({col:h,n:parseInt(tok,10)});
      else                   map.get(ev).special.push({col:h,key:tok});
    });
    map.forEach(v=>v.races.sort((a,b)=>a.n-b.n));
    return map;
  }
  // Events with at least one populated NUMERIC race column — what the race table can build from.
  function raceEvents(){
    const out=new Map();
    raceEventsAll().forEach((v,ev)=>{ if(v.races.length) out.set(ev,v.races); });
    return out;
  }
  // Populated non-numeric race columns for an event (e.g. rFinal). Not used by the group table yet.
  function specialRaceCols(ev){ const v=raceEventsAll().get(ev); return v?v.special:[]; }
  const raceCols=ev=>raceEvents().get(ev)||[];
  function selectedRaces(ev){
    const all=raceCols(ev), sel=RACE_SEL[ev];
    const list=sel?all.filter(r=>sel.has(r.n)):all.slice();
    return list.length?list:all.slice();
  }
  function groupColumnFor(ev){
    const tok=eventToken(ev);
    return STATE.headers.find(h=>h&&/_groups?$/i.test(h)&&eventToken(h.replace(/_groups?$/i,''))===tok)||null;
  }
  // <event>_rFinal_position for the event a column belongs to (the non-numeric race column).
  function finalPositionColumnFor(col){
    const tok=eventToken(col);
    return STATE.headers.find(h=>{
      const mm=h&&h.match(RE_RACE_COL);
      return mm&&!/^\d+$/.test(mm[2])&&eventToken(mm[1])===tok&&STATE.rows.some(r=>num(r[h])!==null);
    })||null;
  }
  function eventPenaltyColumnFor(ev){
    const tok=eventToken(ev);
    return STATE.headers.find(h=>h&&/_event_penalties$/i.test(h)&&eventToken(h)===tok)||null;
  }

  // total desc → classic count-back (most 1sts, then 2nds…) → last selected race → sheet order
  /* Tie-break order matters and has bitten us once — see Valencia 2026 below.
     SailGP splits a points tie on the MOST RECENT race: whoever finished ahead in the last race
     sailed takes the place, walking backwards through the earlier races only if a race is missing
     for either boat. This must run BEFORE any count-back.
     The original code ran a classic sailing count-back (most 1sts, then 2nds, …) first, which gave
     the wrong answer at Valencia: in Group B, Los Gallos and Rockwool Racing both finished on 14
     points after four races. Los Gallos had two wins to Rockwool's one, so the count-back put Los
     Gallos 2nd — but Rockwool beat them in the last race (4th to 6th) and it was Rockwool, not Los
     Gallos, who went through to the event final. The count-back now survives only as a residual
     for data where every race position is equal or absent, which in practice cannot happen within
     a group (positions are unique per race). */
  function raceSort(a,b){
    if(b.pts!==a.pts)return b.pts-a.pts;                     // points first
    for(let i=a.positions.length-1;i>=0;i--){                // then the most recent race, walking back
      const d=asc(a.positions[i])-asc(b.positions[i]);
      if(d)return d;
    }
    for(let p=1;p<=20;p++){                                  // residual only: classic count-back
      const ca=a.positions.filter(x=>x===p).length, cb=b.positions.filter(x=>x===p).length;
      if(ca!==cb)return cb-ca;
    }
    return a.idx-b.idx;                                      // then sheet order
  }
  function raceTableData(){
    const ev=$('in-event').value; if(!ev)return null;
    const races=selectedRaces(ev); if(!races.length)return null;
    const gCol=groupColumnFor(ev), penCol=eventPenaltyColumnFor(ev), finCol=finalPositionColumnFor(ev);
    const rows=STATE.rows.map((r,idx)=>{
      const code=(r.country_code||'').toUpperCase();
      const positions=races.map(rc=>num(r[rc.col]));
      const pen=penCol?num(r[penCol]):null;
      return {idx,code,team:r.team_name||r.nation||'',short:(r.short_team_name||'').trim(),
        fin:finCol?num(r[finCol]):null,
        group:gCol?String(r[gCol]||'').trim().toUpperCase():'',
        // The tool is CALCULATING event points here, so it applies the penalty itself
        // (a sheet-supplied _event_points column is already net and is never adjusted).
        // pen is signed: -2 deducts, +5 awards.
        positions,pts:positions.reduce((s,p)=>s+racePoints(p),0)+((pen!==null)?pen:0),
        pen:(pen!==null&&pen!==0)?pen:null,
        logoSrc:LOGO_MAP[code]||''};
    }).filter(o=>o.positions.some(p=>p!==null));
    if(!rows.length)return null;
    let groups=[];
    if(gCol){
      [...new Set(rows.map(o=>o.group).filter(Boolean))].sort()
        .forEach(k=>groups.push({label:'Group '+k,rows:rows.filter(o=>o.group===k)}));
      const rest=rows.filter(o=>!o.group);
      if(rest.length)groups.push({label:groups.length?'Unassigned':'',rows:rest});
    }
    if(!groups.length)groups.push({label:'',rows});
    const want=$('in-group').value;                       // "" = all groups
    if(want){const only=groups.filter(g=>g.label==='Group '+want);if(only.length)groups=only;}
    groups.forEach(g=>g.rows.sort(raceSort));
    // Once the final has been sailed, <event>_rFinal_position is the truth about who qualified —
    // use it rather than assuming the top two rows went through. Before the final exists we fall
    // back to the top two of each group, which is what the highlight means in that state.
    return {ev,races,groups,showPen:$('in-pen').checked&&rows.some(o=>o.pen!==null),
            labelled:groups.some(g=>g.label),hasFinal:rows.some(o=>o.fin!==null)};
  }

  // vertical rhythm, expressed in multiples of rowH
  // One header band per table: the gold GROUP title and the R1/R2/R3/PTS labels share its centre line.
  const RT={head:0.62,headGap:0.22,groupGap:0.60,gapF:0.13};
  function raceUnits(data,sideBySide){
    const G=data.groups.length;
    const nRows=sideBySide?Math.max(...data.groups.map(g=>g.rows.length))
                          :data.groups.reduce((s,g)=>s+g.rows.length,0);
    const nBlocks=sideBySide?1:G;
    const perBlock=RT.head+RT.headGap;
    return nRows+RT.gapF*Math.max(0,nRows-nBlocks)+nBlocks*perBlock+Math.max(0,nBlocks-1)*RT.groupGap;
  }
  function raceMetrics(W,H,data){
    const sideBySide=(W>H)&&data.groups.length===2;
    const mX=Math.round(W*0.05), mY=Math.round(H*0.045), cW=W-2*mX;
    const hh=Math.min(cW/1000,H/1200);
    const titleSize=Math.round(84*hh), eyebrowSize=Math.round(18*hh), eyebrowGap=Math.round(11*hh);
    const headerH=eyebrowSize+eyebrowGap+Math.round(titleSize*0.86);
    const headGap=Math.round(34*hh), footSize=Math.round(15*hh), footGap=Math.round(30*hh);
    const avail=(H-mY*2)-headerH-headGap-footSize-footGap;
    let rowH=Math.max(20,Math.floor(avail/raceUnits(data,sideBySide)));
    rowH=Math.min(rowH,Math.round(H*0.105));
    if(sideBySide)rowH=Math.min(rowH,Math.round(cW*0.055));
    // tRow drives TYPE and COLUMN WIDTHS; rowH stays the physical row height. With few rows
    // (e.g. a single group) rowH gets very tall, and scaling the fixed columns off it would
    // squeeze the name column until only country codes fit. tRow caps that against table width.
    const tableW=sideBySide?Math.floor((cW-Math.round(cW*0.045))/2):cW;
    const tRow=Math.min(rowH,Math.round(tableW*0.095));
    return {W,H,mX,mY,cW,hs:hh,titleSize,eyebrowSize,eyebrowGap,
      logoH:Math.round(titleSize*0.72),logoW:Math.round(titleSize*0.72*3.003),
      headerH,headGap,footSize,footGap,rowH,tRow,gap:Math.max(4,Math.round(rowH*RT.gapF)),
      rowsTop:mY+headerH+headGap,sideBySide};
  }
  function curRaceDims(data){
    const v=$('in-format').value; if(FORMATS[v])return FORMATS[v];
    const W=1080,hh=(W-2*Math.round(W*0.05))/1000, titleSize=Math.round(84*hh);
    const headerH=Math.round(18*hh)+Math.round(11*hh)+Math.round(titleSize*0.86);
    const chrome=headerH+Math.round(34*hh)+Math.round(15*hh)+Math.round(30*hh);
    const H=Math.round((chrome+raceUnits(data,false)*80)/(1-0.09));
    return [W,H];
  }
  function raceColumnWidths(tRow,nRaces,showPen,tableW,raceOv,ptsOv){
    const posCol=Math.round(tRow*0.82), logoCol=Math.round(tRow*0.72);
    const ptsCol=ptsOv||Math.round(tRow*1.05), penCol=showPen?Math.round(tRow*0.95):0;
    const namePad=Math.round(tRow*0.18), minName=Math.round(tRow*1.9);
    let raceCol=raceOv||Math.round(tRow*0.72);
    if(!raceOv){
      const budget=tableW-posCol-logoCol-namePad*2-ptsCol-penCol-minName;
      if(nRaces*raceCol>budget)raceCol=Math.max(Math.round(tRow*0.42),Math.floor(budget/Math.max(1,nRaces)));
    }
    const nameW=Math.max(10,tableW-posCol-logoCol-namePad*2-nRaces*raceCol-ptsCol-penCol);
    return {posCol,logoCol,raceCol,ptsCol,penCol,namePad,nameW};
  }
  // Pick the label style against the full leftover width, then measure what the labels really need
  // and hand the slack to the race + points columns, so every row fills the canvas width.
  function raceFitColumns(ctx,data,tRow,tableW,sideBySide){
    const nR=data.races.length;
    let C=raceColumnWidths(tRow,nR,data.showPen,tableW);
    const ns=raceNameStyle(ctx,data,C,tRow,sideBySide);
    const all=[].concat(...data.groups.map(g=>g.rows));
    setFont(ctx,ns.weight,ns.size);
    const need=Math.ceil(Math.max(1,...all.map(o=>ctx.measureText(((o[ns.mode]||o.team||'')).toUpperCase()).width)));
    let slack=C.nameW-need-Math.round(tRow*0.45);   // leave a gutter after the longest label
    if(slack>0){
      const maxRace=Math.round(tRow*1.75), maxPts=Math.round(tRow*1.35);
      let race=C.raceCol, pts=C.ptsCol, guard=0;
      while(slack>0 && guard++<4000 && (race<maxRace||pts<maxPts)){
        let spent=0;
        if(race<maxRace && slack>=nR){race++;slack-=nR;spent++;}
        if(pts<maxPts && slack>=1){pts++;slack--;spent++;}
        if(!spent)break;
      }
      C=raceColumnWidths(tRow,nR,data.showPen,tableW,race,pts);
    }
    return {C,ns};
  }
  // Auto: full team name when it fits (shrinking a little is fine in a full-width table, but a
  // half-width side-by-side table only takes a name that fits outright), else short_team_name, else code.
  function raceNameStyle(ctx,data,C,tRow,sideBySide){
    const want=$('in-label').value, all=[].concat(...data.groups.map(g=>g.rows));
    const opt=(key,base,weight)=>{
      setFont(ctx,weight,base);
      const w=Math.max(1,...all.map(o=>ctx.measureText(((o[key]||o.team||'')).toUpperCase()).width));
      const size=w>C.nameW?base*(C.nameW/w):base;
      return{mode:key,size,weight,fits:(w<=C.nameW)||(!sideBySide&&size>=tRow*0.25)};
    };
    const team=opt('team',tRow*0.36,800);
    const short=all.some(o=>o.short)?opt('short',tRow*0.36,800):null;
    const code=opt('code',tRow*0.40,900);
    if(want==='team')return team;
    if(want==='short')return short||team;
    if(want==='code')return code;
    if(team.fits)return team;
    if(short&&short.fits)return short;
    return code;
  }

  function drawRaceTable(ctx,g,data,m,C,ns,logos,x0,y0,tableW){
    const rowH=m.rowH,tRow=m.tRow,gap=m.gap,cut=Math.round(rowH*0.25),nR=data.races.length;
    const qual=$('in-qual').checked;   // event finalists (rFinal when sailed, else top 2 of the group)
    let y=y0;
    const bandH=Math.round(rowH*RT.head), cy=y+bandH/2;
    if(g.label){
      const ls=Math.round(tRow*0.32);
      setFont(ctx,900,ls);setLS(ctx,ls*0.22);
      ctx.fillStyle=GOLD;ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(g.label.toUpperCase(),x0,cy);
      setLS(ctx,0);
    }
    const rightX=x0+tableW-C.penCol-C.ptsCol-nR*C.raceCol;
    const hsz=Math.max(9,Math.round(tRow*0.24));
    setFont(ctx,800,hsz);setLS(ctx,hsz*0.14);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#8a8a8a';
    data.races.forEach((rc,i)=>ctx.fillText('R'+rc.n,rightX+i*C.raceCol+C.raceCol/2,cy));
    ctx.fillStyle=GOLD;ctx.fillText('PTS',rightX+nR*C.raceCol+C.ptsCol/2,cy);
    setLS(ctx,0);
    y+=bandH+Math.round(rowH*RT.headGap);

    for(let i=0;i<g.rows.length;i++){
      const o=g.rows[i],x=x0,w=tableW,h=rowH,ry=y+i*(rowH+gap);
      const goldX=x+w-C.penCol-C.ptsCol, penX=x+w-C.penCol, rX=goldX-nR*C.raceCol;
      ctx.beginPath();ctx.moveTo(x,ry);ctx.lineTo(x+w-cut,ry);ctx.lineTo(x+w,ry+cut);ctx.lineTo(x+w,ry+h);ctx.lineTo(x,ry+h);ctx.closePath();
      ctx.save();ctx.clip();
      ctx.fillStyle='#1a1a1a';ctx.fillRect(x,ry,w,h);
      ctx.fillStyle=GOLD;ctx.fillRect(goldX,ry,C.ptsCol,h);
      if(data.showPen&&o.pen!==null){ctx.fillStyle=o.pen<0?PEN_RED:PEN_GREEN;ctx.fillRect(penX,ry,C.penCol,h);}
      ctx.restore();
      ctx.beginPath();ctx.moveTo(x,ry);ctx.lineTo(x+w-cut,ry);ctx.lineTo(x+w,ry+cut);ctx.lineTo(x+w,ry+h);ctx.lineTo(x,ry+h);ctx.closePath();
      const isQual=data.hasFinal?(o.fin!==null):(i<2);
      if(qual&&isQual){ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(2,Math.round(tRow*0.038));}
      else{ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;}
      ctx.stroke();

      setFont(ctx,900,tRow*0.36);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(i+1),x+C.posCol/2,ry+h/2+1);

      const img=logos.get(o.code)||null, lcx=x+C.posCol+C.logoCol/2, lcy=ry+h/2, lmax=Math.min(rowH*0.58,tRow*0.72);
      if(img){const s=Math.min(lmax/img.width,lmax/img.height);ctx.drawImage(img,lcx-img.width*s/2,lcy-img.height*s/2,img.width*s,img.height*s);}
      else{setFont(ctx,900,tRow*0.22);ctx.fillStyle=GOLD;ctx.fillText(o.code||'',lcx,lcy+1);}

      setFont(ctx,ns.weight,ns.size);ctx.fillStyle='#fff';ctx.textAlign='left';
      ctx.fillText(((o[ns.mode]||o.team||'')).toUpperCase(),x+C.posCol+C.logoCol+C.namePad,ry+h/2+1);

      for(let j=0;j<nR;j++){
        const p=o.positions[j], cx=rX+j*C.raceCol+C.raceCol/2;
        if(p===1){
          const cw=Math.min(Math.round(C.raceCol*0.70),Math.round(tRow*0.66)),ch=Math.round(tRow*0.54),cc=Math.round(ch*0.28);
          const bx=Math.round(cx-cw/2),by=Math.round(ry+h/2-ch/2);
          ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+cw-cc,by);ctx.lineTo(bx+cw,by+cc);ctx.lineTo(bx+cw,by+ch);ctx.lineTo(bx,by+ch);ctx.closePath();
          ctx.fillStyle=GOLD;ctx.fill();
          setFont(ctx,900,tRow*0.32);ctx.fillStyle=CARBON;
        }else{
          setFont(ctx,700,tRow*0.32);ctx.fillStyle=(p===null)?'#4d4d4d':'#e6e6e6';
        }
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(p===null?'–':String(p),cx,ry+h/2+1);
      }

      setFont(ctx,900,tRow*0.40);ctx.fillStyle=CARBON;ctx.textAlign='center';
      ctx.fillText(String(o.pts),goldX+C.ptsCol/2,ry+h/2+1);
      if(data.showPen&&o.pen!==null){
        setFont(ctx,900,tRow*0.34);ctx.fillStyle='#fff';
        ctx.fillText((o.pen>0?'+':'')+o.pen,penX+C.penCol/2,ry+h/2+1);
      }
    }
    return (y-y0)+g.rows.length*rowH+Math.max(0,g.rows.length-1)*gap;
  }

  function drawRaceBody(ctx,data,m,logos,x0,y0,widthOverride){
    const cW=widthOverride||m.cW, gGap=Math.round(m.rowH*RT.groupGap);
    if(m.sideBySide){
      const colGap=Math.round(cW*0.045), tableW=Math.floor((cW-colGap)/2);
      const {C,ns}=raceFitColumns(ctx,data,m.tRow,tableW,true);
      let hMax=0;
      data.groups.forEach((g,i)=>{
        const h=drawRaceTable(ctx,g,data,m,C,ns,logos,x0+i*(tableW+colGap),y0,tableW);
        hMax=Math.max(hMax,h);
      });
      return hMax;
    }
    const {C,ns}=raceFitColumns(ctx,data,m.tRow,cW,false);
    let y=y0;
    data.groups.forEach((g,i)=>{
      y+=drawRaceTable(ctx,g,data,m,C,ns,logos,x0,y,cW);
      if(i<data.groups.length-1)y+=gGap;
    });
    return y-y0;
  }

  async function raceLogos(data){
    const codes=[...new Set([].concat(...data.groups.map(g=>g.rows.map(o=>o.code))))];
    const imgs=await Promise.all(codes.map(c=>loadImg(LOGO_MAP[c]||'')));
    const map=new Map();codes.forEach((c,i)=>map.set(c,imgs[i]));return map;
  }
  async function renderRace(){
    const data=raceTableData();
    const cv=$('cv');
    if(!data){
      cv.width=1080;cv.height=600;const c=cv.getContext('2d');
      drawBackground(c,1080,600);
      setFont(c,800,26);c.fillStyle='#8a8a8a';c.textAlign='center';c.textBaseline='middle';
      c.fillText('No per-race position columns in this sheet.',540,285);
      setFont(c,600,18);c.fillText('Expected columns like  sassnitz_26_r1_position',540,325);
      fitPreview();return;
    }
    const [W,H]=curRaceDims(data);
    cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d'), m=raceMetrics(W,H,data), L=labels();
    const [wm,logos]=await Promise.all([loadImg(WORDMARK),raceLogos(data)]);
    drawBackground(ctx,W,H);
    drawHeader(ctx,m,L,wm);
    drawRaceBody(ctx,data,m,logos,m.mX,m.rowsTop);
    drawFooter(ctx,m,L);
    fitPreview();
  }
  async function exportRaceCards(){
    const data=raceTableData(); if(!data){status('Nothing to export.','err');return;}
    const [W,H]=curRaceDims(data), m=raceMetrics(W,H,data);
    const logos=await raceLogos(data);
    const probe=document.createElement('canvas');probe.width=m.cW;probe.height=Math.max(1,H);
    const bh=Math.ceil(drawRaceBody(probe.getContext('2d'),data,m,logos,0,0));
    const c=document.createElement('canvas');c.width=m.cW;c.height=bh;
    drawRaceBody(c.getContext('2d'),data,m,logos,0,0);
    c.toBlob(b=>downloadBlob(b,fname('-races')),'image/png');
  }

  // ---- race-table UI ----
  function fillEventSelect(preferred){
    const sel=$('in-event'),evs=[...raceEvents().keys()],keep=preferred||sel.value;
    sel.innerHTML='';
    evs.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=prettyEvent(e);sel.appendChild(o);});
    if(evs.length)sel.value=evs.includes(keep)?keep:evs[evs.length-1];
    fillGroupSelect();
    renderChips();
    return sel.value;
  }
  function fillGroupSelect(){
    const sel=$('in-group'),ev=$('in-event').value,keep=sel.value;
    const gCol=ev?groupColumnFor(ev):null;
    const keys=gCol?[...new Set(STATE.rows.map(r=>String(r[gCol]||'').trim().toUpperCase()).filter(Boolean))].sort():[];
    sel.innerHTML='<option value="">All groups</option>';
    keys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent='Group '+k;sel.appendChild(o);});
    sel.disabled=!keys.length;
    sel.value=keys.includes(keep)?keep:'';
    sel.title=keys.length?'':'This event has no groups column';
  }
  function renderChips(){
    const ev=$('in-event').value,box=$('race-chips');box.innerHTML='';
    const all=raceCols(ev);
    if(ev&&!RACE_SEL[ev])RACE_SEL[ev]=new Set(all.map(r=>r.n));
    const sel=RACE_SEL[ev];
    all.forEach(rc=>{
      const b=document.createElement('div');
      b.className='chip'+(sel.has(rc.n)?' on':'');
      b.textContent='R'+rc.n;
      b.onclick=()=>{
        if(sel.has(rc.n)){if(sel.size>1)sel.delete(rc.n);}else sel.add(rc.n);
        renderChips();autoLabelRace();render();
      };
      box.appendChild(b);
    });
    $('race-hint').innerHTML=all.length
      ? 'Select to display'
      : ('No per-race columns found. Expected <code>&lt;event&gt;_r1_position</code>, <code>_r2_position</code>, …');
  }
  function raceRangeLabel(sel){
    const ns=sel.map(r=>r.n);
    const contiguous=ns.every((n,i)=>i===0||n===ns[i-1]+1);
    if(ns.length===1)return 'Race '+ns[0];
    return contiguous?('Races '+ns[0]+'–'+ns[ns.length-1]):('Races '+ns.join(', '));
  }
  function autoLabelRace(force){
    if(!isRaceMode())return;
    const ev=$('in-event').value; if(!ev)return;
    const all=raceCols(ev),sel=selectedRaces(ev);
    const eb=(sel.length===all.length)?'Race Results':raceRangeLabel(sel);
    const cur=$('in-eyebrow').value.trim();
    if(force||cur===''||/^races?\b/i.test(cur)||/^race results$/i.test(cur))$('in-eyebrow').value=eb;
    if(force)$('in-title').value=prettyEvent(ev);
  }
  function syncType(){
    const race=isRaceMode();
    $('grp-standings').style.display=race?'none':'';
    $('grp-race').style.display=race?'':'none';
    if(race){fillEventSelect();autoLabelRace(true);render();}
    else onColumn($('in-col').value,true);
  }

  // ---------- data loading ----------
  function ingest(csvText){
    const parsed=Papa.parse(csvText,{header:true,skipEmptyLines:true});
    const headers=(parsed.meta.fields||[]).map(h=>h.trim());
    const rows=parsed.data.map(r=>{const o={};for(const k in r)o[k.trim()]=r[k];return o;}).filter(r=>r.team_name||r.nation||r.country_code);
    if(!rows.length)throw new Error('no rows');STATE={headers,rows};
  }
  function applyLoaded(){
    RACE_SEL={};
    const chosen=fillColumnSelect($('in-col').value);
    fillEventSelect();
    if(isRaceMode()){autoLabelRace(true);render();}else{onColumn(chosen,true);}
    status('');
  }
  function pickSheetCSV(wb){for(const name of wb.SheetNames){const csv=XLSX.utils.sheet_to_csv(wb.Sheets[name]);if(/team_name|dark_mode_icon|country_code/.test((csv.split('\n')[0]||'').toLowerCase()))return csv;}return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);}
  function loadFile(file){
    if(!file)return;status('Reading file…');const isXlsx=/\.xlsx?$/i.test(file.name);const reader=new FileReader();
    reader.onload=()=>{try{let csv;if(isXlsx){if(typeof XLSX==='undefined')throw new Error('Excel reader unavailable offline — use CSV.');const wb=XLSX.read(new Uint8Array(reader.result),{type:'array'});csv=pickSheetCSV(wb);}else{csv=reader.result;}ingest(csv);applyLoaded();}catch(e){status('Could not read that file: '+e.message,'err');}};
    reader.onerror=()=>status('Could not read that file.','err');
    if(isXlsx)reader.readAsArrayBuffer(file);else reader.readAsText(file);
  }

  function onColumn(col,setLabels){col=col||$('in-col').value;if(setLabels){const L=autoLabels(col);$('in-title').value=L.title;$('in-eyebrow').value=L.eyebrow;}fillPrevSelect();render();}

  $('in-file').onchange=e=>loadFile(e.target.files[0]);
  $('in-col').onchange=e=>onColumn(e.target.value,true);
  $('in-prev').onchange=render;
  $('in-driver').onchange=render;
  $('in-code').onchange=render;
  $('in-fin').onchange=render;
  $('in-format').onchange=render;
  $('in-type').onchange=syncType;
  $('in-event').onchange=()=>{fillGroupSelect();renderChips();autoLabelRace(true);render();};
  $('in-group').onchange=render;
  $('in-qual').onchange=render;
  $('in-label').onchange=render;
  $('in-pen').onchange=render;
  ['in-title','in-eyebrow','in-footl','in-footr'].forEach(id=>$(id).oninput=render);
  $('btn-download').onclick=exportFull;
  $('btn-cards').onclick=exportCards;

  // init
  $('menu-logo').src=WORDMARK;
  STATE=SNAPSHOT;
  fillEventSelect();
  onColumn(fillColumnSelect(), true);
  (document.fonts?document.fonts.load('900 82px Archivo').then(()=>document.fonts.load('600 20px Archivo')):Promise.resolve())
    .then(()=>document.fonts&&document.fonts.ready).then(()=>{render();});
</script>
